server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:app_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 10000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# MyBatis-Plus 仅作为技术栈依赖保留；闭环数据访问统一走 JdbcTemplate 以精确控制行锁
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

rescue:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-please-change-in-prod-0123456789}
    expire-seconds: 43200
  ledger:
    near-expire-days: 30

management:
  endpoint:
    health:
      show-details: never
